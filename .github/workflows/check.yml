name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container: debian:testing
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates build-essential pkg-config rustc cargo rustfmt rust-clippy nodejs npm libgtk-4-dev libwebkitgtk-6.0-dev libgtk4-layer-shell-dev libpam0g-dev libclang-dev
      - uses: actions/checkout@v4
      - name: Check
        env:
          MERIDIAN_NO_TOOLBOX: "1"
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tools/check.sh
