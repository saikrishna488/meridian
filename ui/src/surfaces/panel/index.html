<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src meridian:; style-src meridian:; font-src meridian:; connect-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>Meridian top bar</title>
    <link rel="stylesheet" href="../../lib/base.css" />
    <link rel="stylesheet" href="panel.css" />
    <script type="module" src="panel.js"></script>
  </head>
  <body>
    <nav class="bar" aria-label="Top bar">
      <button class="bar-button" id="applications" aria-haspopup="menu" aria-expanded="false">Applications</button>
      <ul class="windows" id="windows" aria-label="Running applications"></ul>
      <button class="bar-button" id="options" aria-haspopup="menu" aria-expanded="false">Options</button>
    </nav>
  </body>
</html>
